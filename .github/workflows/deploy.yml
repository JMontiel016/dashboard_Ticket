name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 20

      # La TV React se compila antes de publicar. Un error impide un deploy incompleto.
      - name: Build tv-react
        working-directory: tv-react
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=dashboard-bepa --commit-dirty=true
